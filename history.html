<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Riwayat Sensor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#030303;
    color:white;
    height:100vh;
    overflow:hidden;
    position:relative;
}

/* Glow Background */

body::before{
    content:'';
    position:fixed;
    width:500px;
    height:500px;
    background:#2563eb;
    filter:blur(220px);
    opacity:.15;
    top:-250px;
    left:-150px;
    z-index:-1;
}

body::after{
    content:'';
    position:fixed;
    width:400px;
    height:400px;
    background:#2563eb;
    filter:blur(180px);
    opacity:.08;
    bottom:-150px;
    right:-100px;
    z-index:-1;
}

/* =======================
   NAVBAR
======================= */

.navbar{

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:85px;

    background:rgba(3,3,3,.9);

    backdrop-filter:blur(15px);

    border-bottom:1px solid #1a1a1a;

    display:grid;

    grid-template-columns:
    260px 1fr 120px;

    align-items:center;

    padding:0 35px;

    z-index:999;
}

.brand{

    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{

    width:45px;
    height:45px;

    border-radius:50%;

    background:#2563eb;

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:
    0 0 15px rgba(37,99,235,.5);
}

.brand h2{
    font-size:16px;
}

.brand p{
    font-size:12px;
    color:#888;
}

.nav-links a{
    visibility:hidden;
}

.nav-links{

    display:flex;
    justify-content:center;
    gap:35px;
}

.nav-links a{

    text-decoration:none;
    color:#aaa;
    transition:.3s;
}

.nav-links a:hover{
    color:#3b82f6;
}

.back-btn{

    background:#2563eb;

    color:white;

    text-decoration:none;

    text-align:center;

    padding:10px;

    border-radius:12px;

    transition:.3s;
}

.back-btn:hover{
    background:#3b82f6;
}

/* =======================
   PAGE
======================= */

.page-content{

    margin-top:105px;

    padding:20px 30px;

    height:calc(100vh - 105px);

    display:flex;

    flex-direction:column;

    animation:fadeInScale .8s ease;
}

@keyframes fadeInScale{

    from{
        opacity:0;
        transform:scale(1.05);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

.page-exit{

    animation:zoomOut .8s forwards;
}

@keyframes zoomOut{

    from{
        opacity:1;
        transform:scale(1);
    }

    to{
        opacity:0;
        transform:scale(1.1);
    }

}

/* =======================
   BUTTONS
======================= */

.action-buttons{

    display:flex;

    gap:15px;

    margin-bottom:20px;
}

.export-btn,
.clear-btn{

    border:none;

    padding:12px 20px;

    border-radius:12px;

    cursor:pointer;

    text-decoration:none;

    color:white;

    font-size:15px;

    transition:.3s;
}

.export-btn{

    background:#16a34a;
}

.export-btn:hover{

    background:#15803d;
}

.sync-btn{

    background:#2563eb;

    color:white;

    border:none;

    padding:12px 20px;

    border-radius:12px;

    cursor:pointer;

    transition:.3s;

}

.sync-btn:hover{

    background:#3b82f6;

}

.clear-btn{

    background:#dc2626;
}

.clear-btn:hover{

    background:#b91c1c;
}

/* =======================
   TABLE
======================= */

.table-container{

    flex:1;

    background:
    linear-gradient(
    180deg,
    #080808,
    #050505
    );

    border:1px solid #1a1a1a;

    border-radius:25px;

    overflow:auto;

    box-shadow:
    0 0 35px rgba(37,99,235,.08);
}

table{

    width:100%;

    border-collapse:collapse;
}

thead{

    position:sticky;

    top:0;

    background:#080808;

    z-index:10;
}

th{

    color:#3b82f6;

    padding:18px;

    text-align:left;

    border-bottom:
    1px solid #1a1a1a;
}

td{

    padding:16px;

    border-bottom:
    1px solid rgba(255,255,255,.05);
}

tr:hover{

    background:
    rgba(37,99,235,.08);
}

.status-normal{

    color:#22c55e;

    font-weight:bold;

    text-shadow:
    0 0 10px rgba(34,197,94,.4);
}

.status-hot{

    color:#ef4444;

    font-weight:bold;

    text-shadow:
    0 0 10px rgba(239,68,68,.4);
}

.status-cold{

    color:#3b82f6;

    font-weight:bold;

    text-shadow:
    0 0 10px rgba(59,130,246,.4);
}

</style>
</head>

<body>

<nav class="navbar">

    <div class="brand">

        <div class="avatar">
            👤
        </div>

        <div>

            <h2>Admin</h2>

            <p>Monitoring System</p>

        </div>

    </div>

    <div class="nav-links">

        <a href="history.html">
            Historis
        </a>

        <a href="statistik.html">
            Statistik
        </a>

        <a href="settings.html">
            Pengaturan
        </a>

    </div>

    <a href="#"
       class="back-btn"
       onclick="goBack(event)">
       Back
    </a>

</nav>

<div class="page-content">

    <div class="action-buttons">

        <a href="export_excel.php"
           class="export-btn">

           📥 Export Excel

        </a>
        <button onclick="syncSheet()"
                class="sync-btn">

            ☁ Sync Spreadsheet

        </button>

        <button onclick="clearHistory()"
                class="clear-btn">

            🗑 Clear History

        </button>

    </div>

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Sensor</th>

                    <th>Zona</th>

                    <th>Suhu</th>

                    <th>Kelembaban</th>

                    <th>Status</th>

                    <th>Waktu</th>

                </tr>

            </thead>

            <tbody id="historyBody">

            </tbody>

        </table>

    </div>

</div>

<script>

if(localStorage.getItem('login') !== 'true'){

    window.location.href =
    'login.html';

}

/* =======================
   BACK ANIMATION
======================= */

function goBack(event){

    event.preventDefault();

    document.querySelector('.page-content')
            .classList.add('page-exit');

    setTimeout(()=>{

        window.location.href =
        'monitoring.html';

    },800);

}

/* =======================
   LOAD HISTORY
======================= */

async function loadHistory(){

    try{

        const response =
        await fetch(
        'http://localhost/monitoring_suhu/history_api.php'
        );

        const data =
        await response.json();

        let html = '';

        data.sensors.forEach(sensor=>{

            const suhu =
            parseFloat(sensor.temp);

            let batasSuhu = 30;

            // DHT02 maksimal 25°C
            if(sensor.id === "DHT02"){
                batasSuhu = 30;
            }

            let status =
            '<span class="status-normal">Normal</span>';

            if(suhu > batasSuhu){

                status =
                '<span class="status-hot">⚠ Suhu Terlalu Tinggi</span>';

            }
            else if(suhu < 20){

                status =
                '<span class="status-cold">🥶 Suhu Terlalu Rendah</span>';

            }


            html += `

            <tr>

                <td>${sensor.id}</td>

                <td>${sensor.zone}</td>

                <td>${sensor.temp}°C</td>

                <td>${sensor.humidity}%</td>

                <td>${status}</td>

                <td>${sensor.time}</td>

            </tr>

            `;

        });

        document.getElementById(
        'historyBody'
        ).innerHTML = html;

    }
    catch(error){

        console.log(error);

    }

}

loadHistory();

setInterval(
loadHistory,
5000
);

/* =======================
   CLEAR HISTORY
======================= */

async function clearHistory(){

    const confirmDelete =
    confirm(
    'Hapus semua riwayat sensor?'
    );

    if(!confirmDelete) return;

    try{

        await fetch(

        'http://localhost/monitoring_suhu/clear_history.php',

        {
            method:'POST'
        });

        loadHistory();

        alert(
        'History berhasil dihapus'
        );

    }
    catch(error){

        console.log(error);

    }

}

async function syncSheet(){

    try{

        const response =
        await fetch(
            'sync_sheet.php'
        );

        const result =
        await response.text();

        alert(result);

    }
    catch(error){

        console.log(error);

        alert(
            'Gagal Sync Spreadsheet'
        );

    }

}

</script>

</body>
</html>
