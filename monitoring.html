<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitoring Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#030303;
    color:white;
    height:100vh;
    overflow:hidden;
    position:relative;
}

/* Glow Background */

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#2563eb;
    filter:blur(220px);
    opacity:.15;
    top:-250px;
    left:-150px;
    z-index:-1;
}

body::after{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:#2563eb;
    filter:blur(200px);
    opacity:.08;
    bottom:-200px;
    right:-150px;
    z-index:-1;
}

/* ======================
   NAVBAR
====================== */

.navbar{

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:85px;

    background:rgba(3,3,3,.9);

    backdrop-filter:blur(15px);

    border-bottom:1px solid #1a1a1a;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 35px;

    z-index:999;
}

.brand{

    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{

    width:45px;
    height:45px;

    border-radius:50%;

    background:#2563eb;

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:
    0 0 15px rgba(37,99,235,.5);
}

.brand h2{

    font-size:16px;
}

.brand p{

    font-size:12px;
    color:#888;
}

.nav-links{

    display:flex;
    gap:35px;
}

.nav-links a{

    text-decoration:none;
    color:#aaa;
    transition:.3s;
}

.nav-links a:hover{

    color:#3b82f6;
}

.back-btn{
    width:120px;
    text-align:center;
    background:#2563eb;
    color:white;

    text-decoration:none;

    padding:10px 20px;

    border-radius:12px;

    transition:all .3s ease;

    font-weight:600;
}

.back-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 0 20px rgba(37,99,235,.4);

    background:#3b82f6;
}

/* ======================
   PAGE ANIMATION
====================== */

.page-content{

    animation:fadeInScale .8s ease;
}

@keyframes fadeInScale{

    from{
        opacity:0;
        transform:scale(1.08);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

.page-exit{

    animation:zoomOut .8s forwards;
}

@keyframes zoomOut{

    from{
        opacity:1;
        transform:scale(1);
    }

    to{
        opacity:0;
        transform:scale(2);
    }

}

/* ======================
   HEADER
====================== */


.header h1{

    font-size:45px;

    margin-bottom:10px;
}

.header p{

    color:#888;
}

/* ======================
   AREA
====================== */

.monitor-wrapper{

    margin-top:110px;

    height:calc(100vh - 130px);

    padding:0 40px 20px 40px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:25px;
}

.area-card{

    background:#080808;

    border:1px solid #1a1a1a;

    border-radius:25px;

    padding:22px;

    box-shadow:
    0 0 22px rgba(59,130,246,.05);

    transition:.3s;
}

.area-card:hover{

    border-color:#2563eb;

    transform:translateY(-5px);
}

.area-title{

    font-size:24px;

    color:#3b82f6;

    margin-bottom:25px;
}

.sensor-box{

    background:#111;

    border-radius:18px;

    padding:16px;

    margin-bottom:15px;
}

.sensor-box span{

    color:#888;

    display:block;
}

.sensor-value{

    font-size:42px;

    font-weight:bold;

    margin-top:10px;
}

.status-box{

    background:#111;

    padding:15px;

    border-radius:15px;

    margin-top:15px;
}

.update-box{

    background:#111;

    padding:15px;

    border-radius:15px;

    margin-top:15px;

    color:#888;
}

.normal{

    color:#22c55e;
}

.warning{

    color:#ef4444;
}

.low{
    color:#3b82f6;
}

</style>
</head>

<body>

<nav class="navbar">

    <div class="brand">

        <div class="avatar">
            👤
        </div>

        <div>

            <h2>Admin</h2>

            <p>Monitoring System</p>

        </div>

    </div>

    <div class="nav-links">

        <a href="history.html">Historis</a>

        <a href="statistik.html">Statistik</a>

        <a href="settings.html">Pengaturan</a>

    </div>

    <a href="#"
       class="back-btn"
       onclick="goDashboard(event)">

       Back

    </a>

</nav>

<div class="page-content">


<div class="monitor-wrapper">

    <div class="area-card">

        <h2 class="area-title">
            🌡️ Area 1
        </h2>

        <div class="sensor-box">

            <span>Suhu</span>

            <div class="sensor-value"
                 id="temp1">
                 --°C
            </div>

        </div>

        <div class="sensor-box">

            <span>Kelembaban</span>

            <div class="sensor-value"
                 id="hum1">
                 --%
            </div>

        </div>

        <div class="status-box"
             id="status1">

             Menunggu data...

        </div>

        <div class="update-box"
             id="time1">

             -

        </div>

    </div>

    <div class="area-card">

        <h2 class="area-title">
            🌀 Area 2
        </h2>

        <div class="sensor-box">

            <span>Suhu</span>

            <div class="sensor-value"
                 id="temp2">
                 --°C
            </div>

        </div>

        <div class="sensor-box">

            <span>Kelembaban</span>

            <div class="sensor-value"
                 id="hum2">
                 --%
            </div>

        </div>

        <div class="status-box"
             id="status2">

             Menunggu data...

        </div>

        <div class="update-box"
             id="time2">

             -

        </div>

    </div>

</div>

</div>

<script>

if(localStorage.getItem('login') !== 'true'){
    window.location.href='login.html';
}

const API_URL =
'http://localhost/monitoring_suhu/api.php';

function goDashboard(event){

    event.preventDefault();

    document.body.classList.add('page-exit');

    setTimeout(()=>{

        window.location.href='index.html';

    },800);

}

async function loadData(){

    try{

        const response =
        await fetch(API_URL);

        const data =
        await response.json();

        const area1 =
        data.sensors.find(
            s => s.zone === 'masuk'
        );

        const area2 =
        data.sensors.find(
            s => s.zone === 'penyimpanan'
        );

        if(area1){

            temp1.innerText =
            area1.temp + '°C';

            hum1.innerText =
            area1.humidity + '%';

            time1.innerText =
            'Update : ' + area1.time;

            if(area1.temp > 30){

                status1.innerHTML =
                '⚠ Suhu Terlalu Tinggi';

                status1.className =
                'status-box warning';

            }
            else if(area1.temp < 20){

                status1.innerHTML =
                '🥶 Suhu Terlalu Rendah';

                status1.className =
                'status-box low';

            }
            else{

                status1.innerHTML =
                '✅ Kondisi Normal';

                status1.className =
                'status-box normal';

            }

        }

        if(area2){

            temp2.innerText =
            area2.temp + '°C';

            hum2.innerText =
            area2.humidity + '%';

            time2.innerText =
            'Update : ' + area2.time;

            if(area2.temp > 30){

                status2.innerHTML =
                '⚠ Suhu Terlalu Tinggi';

                status2.className =
                'status-box warning';

            }
            else if(area2.temp < 20){

                status2.innerHTML =
                '🥶 Suhu Terlalu Rendah';

                status2.className =
                'status-box low';

            }
            else{

                status2.innerHTML =
                '✅ Kondisi Normal';

                status2.className =
                'status-box normal';

            }
        }

    }
    catch(err){

        console.log(err);

    }

}

loadData();

setInterval(loadData,3000);

</script>

</body>
</html>
